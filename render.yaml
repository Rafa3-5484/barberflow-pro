services:
  - type: web
    name: barberflow-pro
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy && npm run build && cd ../frontend && npm install && npm run build && cd .. && npm install
    startCommand: node start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BACKEND_PORT
        value: "4001"
      - key: FRONTEND_PORT
        value: "3001"
